<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <style>
    .component { fill: #e6f2ff; stroke: #0066cc; stroke-width: 2; }
    .control-unit { fill: #d4e6ff; stroke: #0056b3; stroke-width: 3; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0056b3; }
    .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-style: italic; fill: #0066cc; }
    .connection { stroke: #666; stroke-width: 2; }
    .connection-dash { stroke: #666; stroke-width: 2; stroke-dasharray: 5,5; }
    .arrow { fill: #666; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #666; font-style: italic; }
    .company { font-family: Arial, sans-serif; font-size: 12px; fill: #999; }
  </style>

  <!-- Background and Title -->
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="40" text-anchor="middle" class="title">Digital Float Control System</text>
  <text x="400" y="65" text-anchor="middle" class="subtitle">Component Diagram</text>
  <text x="700" y="580" text-anchor="end" class="company">© Skymatik Aero</text>

  <!-- Central Control Unit -->
  <rect x="300" y="100" width="200" height="140" rx="10" ry="10" class="control-unit"/>
  <text x="400" y="125" text-anchor="middle" class="title">Control Unit</text>
  <text x="400" y="150" text-anchor="middle" class="text">Main Controller</text>
  <text x="400" y="175" text-anchor="middle" class="text">- Application Logic</text>
  <text x="400" y="200" text-anchor="middle" class="text">- Protocol Handler</text>
  <text x="400" y="225" text-anchor="middle" class="text">- Bootloader</text>

  <!-- Input Switches -->
  <rect x="50" y="150" width="150" height="100" rx="5" ry="5" class="component"/>
  <text x="125" y="175" text-anchor="middle" class="title">Input Controls</text>
  <text x="125" y="200" text-anchor="middle" class="text">- LDG Switch</text>
  <text x="125" y="220" text-anchor="middle" class="text">- Rudder Switch</text>
  <text x="125" y="240" text-anchor="middle" class="text">- Test Switch</text>

  <!-- LED Indicators -->
  <rect x="50" y="300" width="150" height="90" rx="5" ry="5" class="component"/>
  <text x="125" y="325" text-anchor="middle" class="title">LED Indicators</text>
  <text x="125" y="350" text-anchor="middle" class="text">Status Display</text>
  <circle cx="100" cy="375" r="8" fill="green" stroke="#333" stroke-width="1"/>
  <circle cx="125" cy="375" r="8" fill="blue" stroke="#333" stroke-width="1"/>
  <circle cx="150" cy="375" r="8" fill="red" stroke="#333" stroke-width="1"/>

  <!-- I2C Bus -->
  <rect x="325" y="310" width="150" height="60" rx="5" ry="5" class="component"/>
  <text x="400" y="335" text-anchor="middle" class="title">I2C Bus</text>
  <text x="400" y="355" text-anchor="middle" class="text">Device Communication</text>

  <!-- Communication Interface -->
  <rect x="600" y="150" width="150" height="70" rx="5" ry="5" class="component"/>
  <text x="675" y="175" text-anchor="middle" class="title">UART Interface</text>
  <text x="675" y="200" text-anchor="middle" class="text">Configuration</text>

  <!-- Control Channels -->
  <rect x="600" y="250" width="150" height="160" rx="5" ry="5" class="component"/>
  <text x="675" y="275" text-anchor="middle" class="title">Control Channels</text>
  <text x="675" y="300" text-anchor="middle" class="text">(up to 6 channels)</text>
  
  <rect x="620" y="320" width="110" height="25" rx="3" ry="3" fill="#d9e6f2" stroke="#4d94ff"/>
  <text x="675" y="337" text-anchor="middle" class="text" style="font-size: 12px;">Landing Gear</text>
  
  <rect x="620" y="355" width="110" height="25" rx="3" ry="3" fill="#d9e6f2" stroke="#4d94ff"/>
  <text x="675" y="372" text-anchor="middle" class="text" style="font-size: 12px;">Rudder Control</text>

  <!-- Storage -->
  <rect x="325" y="400" width="150" height="80" rx="5" ry="5" class="component"/>
  <text x="400" y="425" text-anchor="middle" class="title">Flash Storage</text>
  <text x="400" y="450" text-anchor="middle" class="text">Configuration Data</text>
  <text x="400" y="470" text-anchor="middle" class="text">User Settings</text>

  <!-- I2C Devices -->
  <rect x="600" y="440" width="150" height="90" rx="5" ry="5" class="component"/>
  <text x="675" y="465" text-anchor="middle" class="title">I2C Devices</text>
  <text x="675" y="490" text-anchor="middle" class="text">- I/O Expanders</text>
  <text x="675" y="510" text-anchor="middle" class="text">- Power Monitors</text>

  <!-- Connection Lines -->
  <!-- Input Switches to Control Unit -->
  <line x1="200" y1="180" x2="300" y2="170" class="connection"/>
  <polygon points="295,167 300,170 295,173" class="arrow"/>
  <text x="250" y="165" text-anchor="middle" class="label">Control Input</text>

  <!-- Control Unit to LED Indicators -->
  <line x1="300" y1="190" x2="200" y2="310" class="connection"/>
  <polygon points="198,305 200,310 202,305" class="arrow"/>
  <text x="220" y="250" text-anchor="middle" class="label">Status Display</text>

  <!-- Control Unit to I2C Bus -->
  <line x1="400" y1="240" x2="400" y2="310" class="connection"/>
  <polygon points="397,305 400,310 403,305" class="arrow"/>

  <!-- Control Unit to Communication Interface -->
  <line x1="500" y1="160" x2="600" y2="175" class="connection"/>
  <polygon points="595,172 600,175 595,178" class="arrow"/>
  <text x="550" y="155" text-anchor="middle" class="label">Config/Monitoring</text>

  <!-- Control Unit to Control Channels -->
  <line x1="500" y1="200" x2="600" y2="270" class="connection"/>
  <polygon points="596,266 600,270 596,274" class="arrow"/>
  <text x="540" y="225" text-anchor="middle" class="label">Control</text>

  <!-- I2C Bus to Control Channels -->
  <line x1="475" y1="340" x2="600" y2="340" class="connection-dash"/>
  <polygon points="595,337 600,340 595,343" class="arrow"/>
  <text x="540" y="330" text-anchor="middle" class="label">Monitoring</text>

  <!-- I2C Bus to I2C Devices -->
  <line x1="475" y1="350" x2="600" y2="450" class="connection"/>
  <polygon points="596,446 600,450 596,454" class="arrow"/>

  <!-- Control Unit to Storage -->
  <line x1="400" y1="240" x2="400" y2="400" class="connection-dash"/>
  <polygon points="397,395 400,400 403,395" class="arrow"/>
  <text x="420" y="350" text-anchor="middle" class="label">Settings</text>

  <!-- Control Channels to I2C Devices -->
  <line x1="675" y1="410" x2="675" y2="440" class="connection-dash"/>
  <polygon points="672,435 675,440 678,435" class="arrow"/>
</svg> 